[package]
name = "dflash-mlx"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "DFlash block-diffusion speculative decoding for MLX Rust"

[dependencies]
mlx-rs = { path = "../mlx-rs", features = ["metal", "accelerate", "safetensors"] }
mlx-sys = { path = "../mlx-rs/mlx-sys" }
mlx-rs-core = { path = "../mlx-rs-core" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.6"
memmap2 = "0.9"
qwen3-6-mlx = { path = "../qwen3.6-mlx" }
gemma4-mlx = { path = "../gemma4-mlx" }

[dev-dependencies]
anyhow = "1"

[[example]]
name = "generate"
path = "examples/generate.rs"
