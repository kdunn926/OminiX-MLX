[package]
name = "paddleocr-vl-mlx"
version = "0.1.0"
edition = "2021"
description = "PaddleOCR-VL-1.5 inference on Apple Silicon with MLX (in-progress)"
license = "MIT OR Apache-2.0"

[dependencies]
mlx-rs = { path = "../mlx-rs", features = ["metal", "accelerate"] }
mlx-rs-core = { path = "../mlx-rs-core" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", features = ["http"] }
image = "0.25"

[dev-dependencies]
anyhow = "1"
