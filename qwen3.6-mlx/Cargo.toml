[package]
name = "qwen3-6-mlx"
version = "0.1.0"
edition = "2021"
description = "Qwen3.6-35B-A3B hybrid DeltaNet+MoE inference on Apple Silicon with MLX"
license = "MIT OR Apache-2.0"

[dependencies]
mlx-rs = { path = "../mlx-rs", features = ["metal", "accelerate"] }
mlx-sys = { path = "../mlx-rs/mlx-sys" }
mlx-rs-core = { path = "../mlx-rs-core" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
anyhow = "1"
# Reranker "drafter" for kvflash host paging: Qwen3-Reranker-0.6B is a Qwen3
# dense causal LM, loaded via the qwen3-mlx crate (example/spike only).
qwen3-mlx = { path = "../qwen3-mlx" }

[[example]]
name = "generate"
path = "examples/generate.rs"
