[package]
name = "gemma4-mlx"
version = "0.1.1"
edition = "2021"
description = "Gemma 4 text-only inference on Apple Silicon with MLX"
license = "MIT OR Apache-2.0"

[dependencies]
mlx-rs = { path = "../mlx-rs", features = ["metal", "accelerate"] }
mlx-rs-core = { path = "../mlx-rs-core" }
mlx-sys = { path = "../mlx-rs/mlx-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.21"
image = "0.25"
# Jinja chat-template rendering. We prefer running the model's bundled
# `chat_template.jinja` directly (it is what the model was trained on) over
# the hand-rolled Rust renderer, which has drifted from upstream templates
# in subtle ways (role name, e4b empty-channel pre-fill, tool-call syntax).
# `loader` is unused but pulled in to match the other minijinja consumer
# in this workspace (`mlx-rs-lm`). `pycompat` provides `.get()` / `.split()`
# bindings the Gemma4 templates rely on.
minijinja = { version = "2", features = ["loader"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

[[example]]
name = "chat_gemma4"
path = "examples/chat_gemma4.rs"

[[example]]
name = "chat_text"
path = "examples/chat_text.rs"

[[example]]
name = "sliding_bench"
path = "examples/sliding_bench.rs"

[[example]]
name = "chat_gemma4_ud"
path = "examples/chat_gemma4_ud.rs"

[[example]]
name = "tool_chat_gemma4"
path = "examples/tool_chat_gemma4.rs"

[[example]]
name = "repro_chat"
path = "examples/repro_chat.rs"

[[example]]
name = "test_e4b_coherence"
path = "examples/test_e4b_coherence.rs"

[[example]]
name = "ar_bench"
path = "examples/ar_bench.rs"

[[example]]
name = "assistant_smoke"
path = "examples/assistant_smoke.rs"

[[example]]
name = "pair_smoke"
path = "examples/pair_smoke.rs"

[[example]]
name = "mtplx_chat"
path = "examples/mtplx_chat.rs"

[[example]]
name = "draft_verify_spike"
path = "examples/draft_verify_spike.rs"

[[example]]
name = "model_parity"
path = "examples/model_parity.rs"

[[example]]
name = "decode_consistency"
path = "examples/decode_consistency.rs"

[dev-dependencies]
anyhow = "1"
coreml-bridge = { path = "../ane-vit/coreml-bridge" }
npyz = "0.8"
# Reranker "drafter" for kvflash host paging (ar_bench example only):
# Qwen3-Reranker-0.6B is a Qwen3 dense LM, loaded via the qwen3-mlx crate.
qwen3-mlx = { path = "../qwen3-mlx" }

