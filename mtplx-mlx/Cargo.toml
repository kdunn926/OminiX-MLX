[package]
name = "mtplx-mlx"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Multi-Token Prediction (MTP) speculative decoding for MLX Rust"

[dependencies]
mlx-rs = { path = "../mlx-rs", features = ["metal", "accelerate"] }
mlx-sys = { path = "../mlx-rs/mlx-sys" }
mlx-rs-core = { path = "../mlx-rs-core" }
qwen3-6-mlx = { path = "../qwen3.6-mlx" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
anyhow = "1"

[[example]]
name = "bench_mtplx"
path = "examples/bench_mtplx.rs"
